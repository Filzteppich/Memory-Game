<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
</head>
<body>

    <section class="startscreen ">
        <div class="startscreen-content">
            <div class="startscreen-text">
                <p>It's play time.</p>
                <h1>Ready to play?</h1>
            </div>
            <div class="startscreen-button">
                <button id="" class="start-button">
                    <div class="controller_icon_container">
                        <img src="/assets/images/startscreen/stadia_controller_icon.png" alt="controller_icon">
                    </div>
                    <div>
                        Play
                    </div>
                    <div class="arrow-icon-container">
                        <img class="arrow-right-icon" src="/assets/images/startscreen/right-arrow (1).png" alt="">
                    </div>
                </button>
            </div>
        </div>
    </section>

    <section class="settingscreen hidden">
        <div class="settingscreen-wrapper">
            <div class="settings__headline">
                <span class="settings__text">Settings</span> 
            </div>
            <div class="settings__content">
                <div class="settings__content--left">
                    <div class="game-settings">
                        <div class="game-group">
                            <div class="game-settings__icon">
                                <img src="./public/assets/images/settingscreen/palette.png" alt="">
                            </div>
                            <div class="game-settings__group">
                                <div class="game-settings__heading">
                                    <span>Game Themes</span>
                                </div>
                                <div class="game-settings__options">
                                    <div class="game-settings__option">
                                        <label class="game-settings__radio">
                                            <input type="radio" name="theme" value="codeVibeTheme">
                                            <span>Code Vibe Theme</span>
                                        </label>
                                        <label class="game-settings__radio">
                                            <input type="radio" name="theme" value="gamingTheme">
                                            <span>Gaming Theme</span>
                                        </label>
                                        <label class="game-settings__radio">
                                            <input type="radio" name="theme" value="daProjectTheme">
                                            <span>DA Projects theme</span>
                                        </label>
                                        
                                    </div>
                                </div>
                            </div>
                            
                        </div>


                        <div class="game-group">
                            <div class="game-settings__icon">
                                <img src="./public/assets/images/settingscreen/chess_pawn.png" alt="">
                            </div>
                            <div class="game-settings__group">
                                <div class="game-settings__heading">
                                    <span>Choose Player</span>
                                </div>
                                <div class="game-settings__options">
                                    <div class="game-settings__option">
                                        <label class="game-settings__radio">
                                            <input type="radio" name="player-colour" value="blue">
                                            <span>Blue</span>
                                        </label>
                                        <label class="game-settings__radio">
                                            <input type="radio" name="player-colour" value="orange">
                                            <span>Orange</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                                                                   <div class="game-group">
                            <div class="game-settings__icon">
                                <img src="./public/assets/images/settingscreen/style.png" alt="">
                            </div>
                            <div class="game-settings__group">
                                <div class="game-settings__heading">
                                    <span>Board size</span>
                                </div>
                                <div class="game-settings__options">
                                    <div class="game-settings__option">
                                        <label class="game-settings__radio">
                                            <input type="radio" name="board-size" value="16">
                                            <span>16 Cards</span>
                                        </label>
                                        <label class="game-settings__radio">
                                            <input type="radio" name="board-size" value="24">
                                            <span>24 Cards</span>
                                        </label>
                                        <label class="game-settings__radio">
                                            <input type="radio" name="board-size" value="36">
                                            <span>36 Cards</span>
                                        </label>
                                        
                                    </div>
                                </div>
                            </div>
                            
                        </div>  



                    </div>
                </div>
                <div class="settings__content--right">
                    <div class="overview__preview">
                        <img id="themePreviewImg"  src="./public/assets/images/settingscreen/code-vibes-theme.png" alt="">
                    </div>
                    <div class="overview">
                        <div class="overview__active-option"><span id="gameThemeOverview">Game Theme</span></div>
                        <div class="overview__seperator"><hr></div>
                        <div class="overview__active-option"><span id="gamePlayerOverview">Player</span></div>
                        <div class="overview__seperator"><hr></div>
                        <div class="overview__active-option"><span id="gameBoardOverview">Board size</span></div>
                        <button disabled class="overview__start-button disabled">
                            <img src="./public/assets/images/settingscreen/play-icon.png" alt="">
                            <span>Start</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="gamescreen hidden pink-font">
        <div class="gamescreen__wrapper">
            <div class="game__header">
                <div class="game__player-overview">
                    <div class="game__blue-player">
                        <div>
                            <img class="blue-icon" src="./public/assets/themes/code-vibe/blue_label.png" alt=""> 
                        </div>
                        <div>
                            <span>Blue</span>
                        </div>
                        <div>
                            <span class="blue-score">0</span>
                        </div>
                    </div>
                    <div class="game__orange-player">
                        <div>
                            <img class="blue-icon" src="./public/assets/themes/code-vibe/orange_label.png" alt=""> 
                        </div>
                        <div>
                            <span>Orange</span>
                        </div>
                        <div>
                            <span class="orange-score">0</span>
                        </div>
                    </div>
                </div>
                <div class="game__current-player-overview">
                    Current Player: <img src="./public/assets/themes/code-vibe/blue_label.png" alt=""></span>
                </div>
                <div class="game__exit">
                    <button id="exitBtn">Exit Game</button>
                </div>
            </div>
            <div class="game__field">
                <section id="field" class="field">

         <button class="card" type="button">
            <div class="card__inner">
                <div class="card__face">
                    <img  src="./public/assets/themes/code-vibe/img_10.png" alt="">
                </div>
                <div class="card__face card__face--back">
                    <img src="./public/assets/themes/code-vibe/card_back.png" alt="">
                </div>
            </div>
        </button>
        
         <button class="card" type="button">
            <div class="card__inner">
                <img class="card__face card__face--front" alt="" src="./public/assets/themes/code-vibe/img_10.png">
                <img class="card__face card__face--back" alt="" src="./public/assets/themes/code-vibe/card_back.png">
            </div>
        </button>
    
                </section>

            </div>
        </div>
    </section>

    <section class="exit__dialogue hidden">
        <div class="exit__wrapper">
            <div class="exit__text"><span>Are you sure you want to leave the game?</span></div>
            <div class="exit__buttons">
                <button class="exit__button--cancel"><span>Back to game</span></button>
                <button class="exit__button--confirm"><span>Exit game</span></button>
            </div>
        </div>

    </section>



</body>
</html>
<script type="module" src="./src/main.ts"></script>
<script type="module" src="./src/ts/home-screen.ts"></script>
<script type="module" src="./src/ts/setting-screen.ts"></script>
<script type="module" src="./src/ts/templates.ts"></script>
<script type="module" src="./src/ts/game-screen.ts"></script>
<script type="module" src="./src/ts/themes.ts"></script>
